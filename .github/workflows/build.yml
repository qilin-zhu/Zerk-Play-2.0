name: Build

on:
  workflow_dispatch:
  push:
    # `test-build` compiles the same way but only publishes a pre-release (see
    # the test_release job), so a build that is still being verified never
    # lands on /releases/latest and never prompts clients to update.
    branches: [main, test-build]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'

env:
  # The toolchain this project was created with (.metadata revision 4cf24164).
  # Newer stable releases require a higher Android Gradle Plugin than the
  # project uses, which breaks the build.
  FLUTTER_VERSION: '3.47.0'
  # Single source of truth for the release tag, the asset names and the
  # installer. Keep it in sync with pubspec.yaml (version:) and
  # lib/core/log/app_log.dart (appVersion).
  APP_VERSION: '2.10.17'

# The release job pushes a tag and uploads assets.
permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # APP_VERSION feeds Release.version, which the update checker compares
      # against the latest GitHub release tag.
      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_VERSION=$APP_VERSION

      # Renaming here keeps the release page readable: every asset carries the
      # version, so a user can tell two downloads apart in their folder.
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ZerkPlay-${APP_VERSION}-android.apk"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      # The app loads libmpv at runtime with DynamicLibrary.open('libmpv-2.dll'),
      # and windows/CMakeLists.txt installs windows/libs/libmpv-2.dll next to the
      # executable, so the DLL only has to be in place before the build.
      - name: Fetch libmpv
        shell: pwsh
        env:
          # Anonymous calls to api.github.com are rate limited per runner IP and
          # fail intermittently; the workflow token gets its own quota.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $headers = @{ 'User-Agent' = 'zerk-play-ci'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GH_TOKEN) { $headers['Authorization'] = "Bearer $($env:GH_TOKEN)" }
          $rel = $null
          for ($i = 1; $i -le 4; $i++) {
            try {
              $rel = Invoke-RestMethod -Headers $headers -Uri $api
              break
            } catch {
              if ($i -eq 4) { throw }
              Write-Host "release lookup failed (attempt $i): $_"
              Start-Sleep -Seconds (5 * $i)
            }
          }
          $asset = $rel.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-.+\.7z$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'No mpv-dev-x86_64 asset in the latest mpv build' }
          Write-Host "Using $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)"

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive

          $dest = Join-Path $env:RUNNER_TEMP 'mpv-dev'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          & 7z x $archive "-o$dest" -y | Out-Null

          $dll = Get-ChildItem $dest -Recurse -Filter 'libmpv-2.dll' |
            Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found in the mpv dev package' }

          New-Item -ItemType Directory -Force -Path 'windows/libs' | Out-Null
          Copy-Item $dll.FullName 'windows/libs/libmpv-2.dll' -Force
          Get-Item 'windows/libs/libmpv-2.dll' | Select-Object Name, Length

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # APP_VERSION feeds Release.version, which the update checker compares
      # against the latest GitHub release tag.
      - name: Build Windows release
        run: flutter build windows --release --dart-define=APP_VERSION=$env:APP_VERSION

      # Two artifacts on purpose: the setup.exe is what the console hands out,
      # the portable zip is the escape hatch for people who cannot install.
      - name: Package (setup installer + portable zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'build\windows\x64\runner\Release'
          foreach ($f in @('zerk_play.exe', 'libmpv-2.dll')) {
            if (-not (Test-Path (Join-Path $src $f))) { throw "$f missing in $src" }
          }

          $zip = "ZerkPlay-$env:APP_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zip -Force
          Write-Host "portable: $((Get-Item $zip).Length) bytes"

          # Inno Setup is not guaranteed to be on the image, so install it if
          # the compiler is missing.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Host
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after installing Inno Setup' }

          # The Chinese wizard translation lives in the Inno Setup sources, not
          # in the compiler, so a copy is committed next to the script.
          # installer\zerk_play.iss degrades to English when it is missing.
          if (-not (Test-Path 'installer\ChineseSimplified.isl')) {
            Write-Host 'WARNING: ChineseSimplified.isl missing, the wizard will be English only'
          }

          & $iscc "/DAppVersion=$env:APP_VERSION" 'installer\zerk_play.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item $zip 'dist\' -Force
          Copy-Item 'build\installer\*.exe' 'dist\' -Force
          Get-ChildItem 'dist' | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    # Both platforms must succeed: a release that only carries one of them
    # looks like a broken download to whoever opens the console.
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      # Pre-2.10.1 clients look for fixed asset names (ZerkPlay-Public-*),
      # which no release ever carried, so their update check always said
      # "already up to date". Publishing these copies lets them finally see
      # the 2.10.1 update; the fixed checker ignores them by prefix.
      - name: Copy legacy-named assets for old clients
        run: |
          cp "dist/ZerkPlay-${APP_VERSION}-android.apk" "dist/ZerkPlay-Public-Android.apk"
          cp "dist/ZerkPlay-${APP_VERSION}-setup.exe" "dist/ZerkPlay-Public-Windows-setup.exe"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Zerk Play ${{ env.APP_VERSION }}
          # The console resolves /releases/latest, so this one must win over
          # any older beta tag sitting in the repository.
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **Zerk Play ${{ env.APP_VERSION }} 正式版**

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-setup.exe` | 安装包，推荐 |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-windows-x64-portable.zip` | 免安装，解压即用 |
            | Android | `ZerkPlay-${{ env.APP_VERSION }}-android.apk` | 手机 / 平板 / 电视盒子 |
            | Windows x64 | `ZerkPlay-Public-Windows-setup.exe` | 旧版客户端（≤2.10.0）检查更新专用，与 setup.exe 内容相同 |
            | Android | `ZerkPlay-Public-Android.apk` | 旧版客户端（≤2.10.0）检查更新专用，与 android.apk 内容相同 |

            **更新检查修复**：2.10.0 及更早版本的客户端检查更新始终提示「已是最新版」，本版修复了版本比较逻辑，并通过兼容文件名让旧版客户端也能收到本次更新。

            **国内加速源**：设置 → 诊断 → 「更新使用国内加速源」，GitHub 直连失败的环境可走加速镜像检查和下载更新；直连失败时也会自动尝试镜像。

            **修复 Windows 更新卡死**：下载完安装包后应用退出卡在 HDR 恢复钩子里、安装器又反过来等应用退出。现在应用走窗口销毁的快速退出路径，安装器遇到占用会直接强制关闭应用。

            **退出更迅速**：点退出后窗口立即消失，HDR / 刷新率恢复改到后台线程，不再阻塞窗口关闭；更新退出走同一条快速路径。

            **诊断页调整**：移除「把日志发送给开发者」；「详细播放器日志」默认关闭，需要排查播放问题时再手动打开。

            Windows 端依赖 [libmpv](https://github.com/shinchiro/mpv-winbuild-cmake)，已经打包进安装目录，不用另外装。

            安装包默认装到当前用户目录（不弹 UAC），勾选「创建桌面快捷方式」或从开始菜单启动。

  # Test builds are published as pre-releases so they stay out of
  # /releases/latest: the update checker keeps pointing at the last stable
  # version, and the tag carries the run number so every build gets its own.
  test_release:
    name: Publish test build
    needs: [windows, android]
    if: github.ref == 'refs/heads/test-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ env.APP_VERSION }}-${{ github.run_number }}
          name: 测试版 ${{ env.APP_VERSION }}（构建 ${{ github.run_number }}）
          # Never replaces the stable release clients check for updates.
          make_latest: false
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            dist/ZerkPlay-${{ env.APP_VERSION }}-windows-x64-portable.zip
            dist/ZerkPlay-${{ env.APP_VERSION }}-setup.exe
            dist/ZerkPlay-${{ env.APP_VERSION }}-android.apk
          body: |
            **测试版 ${{ env.APP_VERSION }}**，用来验证下面几项修复，不是正式版。

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-windows-x64-portable.zip` | 免安装，解压即用 |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-setup.exe` | 安装包 |
            | Android | `ZerkPlay-${{ env.APP_VERSION }}-android.apk` | 手机 / 平板 / 电视盒子 |

            **打开某一集时，焦点落在这一集上**
            以前不管点的是第几集，进来以后焦点都在上面的播放按钮，剧集行还是从第 1 集开始显示 —— 打开第 201 集要自己横着翻两百个海报。现在进来就会把剧集行滚到当前这一集，焦点直接落在它的海报上。Emby、Jellyfin、飞牛影视三个服务都是这样。

            **剧集行排序按钮改成图标，选中才展开文字**
            剧集行标题右边那个排序按钮现在平时只显示一个图标（上下箭头向左转了 90°），焦点移上去才展开「正序 / 倒序」文字，标题行不会再被一块常驻的胶囊撑开。按一下整体反转，选择会记住。

            **飞牛影视详情页改成和 Emby 一样的排版**
            以前飞牛的电影、剧集详情是另一套样子：顶部一张 420 高的横图、左边贴一张竖版海报、信息一行行往下排。现在和 Emby / Jellyfin 详情页完全一致 —— 全屏背景图缓慢缩放、标题和评分在一屏 20% 的位置、简介在右侧半栏、下面是同款按钮胶囊、剧集改成一排 16:9 卡片（带集号、播放进度、焦点放大），最后是演职人员圆形头像和底部一行技术信息。季多的剧集会在上面多一排季选择按钮。

            **首页「继续观看」点击先进详情页**
            以前点一下就直接开播，现在和 Emby 一样先进详情页，播放按钮上会写「继续播放 · 剩余 xx」，旁边多一个「从头播放」。想直接播也行：卡片获得焦点时中间会出现播放圆钮，点它就是这个行为。

            **飞牛影视支持从头播放**
            详情页的「从头播放」会忽略服务端记录的进度，从 0 秒开始。

            **飞牛影视的演员头像**
            上一版重写飞牛详情页时，头像请求漏掉了登录凭证，`sys/img` 直接拒绝，所以电影详情页的演员头像变成了首字母方块。凭证补回来了。剧集的演员本来挂在剧名上、单集查不到，现在会顺着单集 → 剧集往下找，剧集详情页也有演职人员行了。

            **排序后焦点回到当前这一集**
            剧集详情页按排序按钮，列表会反转并把当前这一集重新对齐到行首，焦点也回到这一集的海报上，不再停在排序按钮上。Emby、Jellyfin、飞牛影视三个服务都是这样。

