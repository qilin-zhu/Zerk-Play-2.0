name: Build

on:
  workflow_dispatch:
  push:
    # `test-build` compiles the same way but only publishes a pre-release (see
    # the test_release job), so a build that is still being verified never
    # lands on /releases/latest and never prompts clients to update.
    branches: [main, test-build]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'

env:
  # The toolchain this project was created with (.metadata revision 4cf24164).
  # Newer stable releases require a higher Android Gradle Plugin than the
  # project uses, which breaks the build.
  FLUTTER_VERSION: '3.47.0'
  # Single source of truth for the release tag, the asset names and the
  # installer. Keep it in sync with pubspec.yaml (version:) and
  # lib/core/log/app_log.dart (appVersion).
  APP_VERSION: '2.10.16'

# The release job pushes a tag and uploads assets.
permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # APP_VERSION feeds Release.version, which the update checker compares
      # against the latest GitHub release tag.
      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_VERSION=$APP_VERSION

      # Renaming here keeps the release page readable: every asset carries the
      # version, so a user can tell two downloads apart in their folder.
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ZerkPlay-${APP_VERSION}-android.apk"
          ls -lh dist

      # 32-bit-only build for old TV boxes that refuse the universal APK.
      # Deliberately NOT --split-per-abi: that multiplies the versionCode by
      # 1000 per ABI, so the smaller number would no longer install over the
      # bigger one ("App not installed") and the in-app updater, which always
      # serves the universal APK, would be blocked. -Pzerk.abi drops the other
      # ABIs instead, so both APKs keep the same versionCode.
      - name: Build 32-bit APK
        run: flutter build apk --release --target-platform android-arm --android-project-arg=zerk.abi=armeabi-v7a --dart-define=APP_VERSION=$APP_VERSION

      - name: Rename 32-bit APK
        run: |
          # The second build rewrites an APK in the same folder; take the one
          # it just produced instead of assuming a file name.
          newest=$(ls -t build/app/outputs/flutter-apk/*.apk | head -1)
          echo "using $newest"
          cp "$newest" "dist/ZerkPlay-${APP_VERSION}-android-arm32.apk"
          ls -lh dist

      # Flutter 3.35 raised the engine's own minSdkVersion to 24, and the
      # manifest merger keeps the highest value it finds, so the APKs built
      # above still refuse to install on Android 6.0 even though this project
      # asks for 23. Rewrite the packaged manifest, then re-align and re-sign:
      # changing the manifest invalidates the signature, and --min-sdk-version
      # 23 is what makes apksigner add a v1 (JAR) signature - API 23 cannot
      # verify v2-only signatures.
      # The same pass redirects libflutter.so's pthread_setname_np import (a
      # bionic symbol from API 24) to pthread_self, otherwise the library does
      # not load at all and the app closes the moment it is opened.
      - name: Lower minSdk to 23 (Android 6.0)
        run: |
          set -e
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ks="android/app/$(sed -n 's/^storeFile=//p' android/key.properties)"
          key_alias=$(sed -n 's/^keyAlias=//p' android/key.properties)
          store_pass=$(sed -n 's/^storePassword=//p' android/key.properties)
          key_pass=$(sed -n 's/^keyPassword=//p' android/key.properties)
          for f in dist/*.apk; do
            echo "== $f"
            python3 tools/patch_apk_minsdk.py "$f" "$RUNNER_TEMP/patched.apk" 23
            # -P 16 page-aligns the native libraries for 16 KB page devices;
            # build-tools older than 35 do not know that flag.
            if ! "$bt/zipalign" -f -P 16 4 "$RUNNER_TEMP/patched.apk" "$RUNNER_TEMP/aligned.apk" 2>/dev/null; then
              "$bt/zipalign" -f -p 4 "$RUNNER_TEMP/patched.apk" "$RUNNER_TEMP/aligned.apk"
            fi
            "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$key_alias" \
              --ks-pass "pass:$store_pass" --key-pass "pass:$key_pass" \
              --min-sdk-version 23 \
              --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
            mv "$RUNNER_TEMP/signed.apk" "$f"
          done

      # A wrong split only shows up as "cannot install" or an instant crash on
      # someone else's TV, so fail the build here instead:
      #  - the 32-bit APK must carry armeabi-v7a and nothing else, and every
      #    ABI it does carry needs libapp.so (a leftover arm64-v8a directory
      #    without the AOT snapshot makes the app crash on 64-bit devices);
      #  - the universal APK must still carry arm64-v8a;
      #  - both must share one versionCode, otherwise one cannot be installed
      #    over the other and updates break;
      #  - both must declare minSdk 23 and carry a v1 signature, or Android 6.0
      #    rejects the package again;
      #  - and both must still be signed with the project's identity.
      - name: Verify APK ABIs
        run: |
          set -e
          abis() {
            unzip -l "$1" | awk '{print $4}' | grep -E '^lib/' | cut -d/ -f2 | sort -u || true
          }
          a32="dist/ZerkPlay-${APP_VERSION}-android-arm32.apk"
          uni="dist/ZerkPlay-${APP_VERSION}-android.apk"
          for f in "$a32" "$uni"; do
            echo "== $f"
            abis "$f"
            for a in $(abis "$f"); do
              if ! unzip -l "$f" | grep -q "lib/$a/libapp.so"; then
                echo "lib/$a/libapp.so missing in $f" >&2
                exit 1
              fi
            done
          done
          a32abis=$(abis "$a32")
          if [ "$a32abis" != "armeabi-v7a" ]; then
            echo "32-bit APK has unexpected ABIs: [$a32abis]" >&2
            exit 1
          fi
          if ! abis "$uni" | grep -qx 'arm64-v8a'; then
            echo "universal APK lost its arm64-v8a libraries" >&2
            exit 1
          fi

          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$aapt2" ]; then
            vc() { "$aapt2" dump badging "$1" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1; }
            vc32=$(vc "$a32")
            vcu=$(vc "$uni")
            echo "versionCode: arm32=$vc32 universal=$vcu"
            if [ "$vc32" != "$vcu" ]; then
              echo "the two APKs must share a versionCode so either can be installed over the other" >&2
              exit 1
            fi
            for f in "$a32" "$uni"; do
              m=$("$aapt2" dump badging "$f" | sed -n "s/^minSdkVersion:'\([0-9]*\)'/\1/p" | head -1)
              echo "minSdk in $f: $m"
              if [ "$m" != "23" ]; then
                echo "$f declares minSdk $m, the patch did not take" >&2
                exit 1
              fi
            done
          else
            echo "aapt2 not found, skipping versionCode comparison"
          fi

          # A native import that API 23's libc lacks makes the library fail to
          # load, which looks exactly like "installs, then closes instantly".
          python3 tools/check_so_api23.py "$a32" "$uni"

          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in "$a32" "$uni"; do
            # --verbose is what prints the per-scheme result; without it
            # apksigner only reports "verified".
            sig=$("$bt/apksigner" verify --verbose --print-certs "$f" 2>&1)
            if ! echo "$sig" | grep -q 'Verified using v1 scheme (JAR signing): true'; then
              echo "$f has no v1 signature, Android 6.0 will refuse it" >&2
              echo "$sig" | grep -i 'verified using' >&2 || true
              exit 1
            fi
            digest=$(echo "$sig" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "cert ($f): $digest"
            if [ "$digest" != "b891c59b65a0d130fa6a86abb37cd421787bff3f191a6f72ce684a11180e10d7" ]; then
              echo "$f is not signed with the project identity, updates will fail to install" >&2
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      # The app loads libmpv at runtime with DynamicLibrary.open('libmpv-2.dll'),
      # and windows/CMakeLists.txt installs windows/libs/libmpv-2.dll next to the
      # executable, so the DLL only has to be in place before the build.
      - name: Fetch libmpv
        shell: pwsh
        env:
          # Anonymous calls to api.github.com are rate limited per runner IP and
          # fail intermittently; the workflow token gets its own quota.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $headers = @{ 'User-Agent' = 'zerk-play-ci'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GH_TOKEN) { $headers['Authorization'] = "Bearer $($env:GH_TOKEN)" }
          $rel = $null
          for ($i = 1; $i -le 4; $i++) {
            try {
              $rel = Invoke-RestMethod -Headers $headers -Uri $api
              break
            } catch {
              if ($i -eq 4) { throw }
              Write-Host "release lookup failed (attempt $i): $_"
              Start-Sleep -Seconds (5 * $i)
            }
          }
          $asset = $rel.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-.+\.7z$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'No mpv-dev-x86_64 asset in the latest mpv build' }
          Write-Host "Using $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)"

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive

          $dest = Join-Path $env:RUNNER_TEMP 'mpv-dev'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          & 7z x $archive "-o$dest" -y | Out-Null

          $dll = Get-ChildItem $dest -Recurse -Filter 'libmpv-2.dll' |
            Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found in the mpv dev package' }

          New-Item -ItemType Directory -Force -Path 'windows/libs' | Out-Null
          Copy-Item $dll.FullName 'windows/libs/libmpv-2.dll' -Force
          Get-Item 'windows/libs/libmpv-2.dll' | Select-Object Name, Length

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # APP_VERSION feeds Release.version, which the update checker compares
      # against the latest GitHub release tag.
      - name: Build Windows release
        run: flutter build windows --release --dart-define=APP_VERSION=$env:APP_VERSION

      # Two artifacts on purpose: the setup.exe is what the console hands out,
      # the portable zip is the escape hatch for people who cannot install.
      - name: Package (setup installer + portable zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'build\windows\x64\runner\Release'
          foreach ($f in @('zerk_play.exe', 'libmpv-2.dll')) {
            if (-not (Test-Path (Join-Path $src $f))) { throw "$f missing in $src" }
          }

          $zip = "ZerkPlay-$env:APP_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zip -Force
          Write-Host "portable: $((Get-Item $zip).Length) bytes"

          # Inno Setup is not guaranteed to be on the image, so install it if
          # the compiler is missing.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Host
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after installing Inno Setup' }

          # The Chinese wizard translation lives in the Inno Setup sources, not
          # in the compiler, so a copy is committed next to the script.
          # installer\zerk_play.iss degrades to English when it is missing.
          if (-not (Test-Path 'installer\ChineseSimplified.isl')) {
            Write-Host 'WARNING: ChineseSimplified.isl missing, the wizard will be English only'
          }

          & $iscc "/DAppVersion=$env:APP_VERSION" 'installer\zerk_play.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item $zip 'dist\' -Force
          Copy-Item 'build\installer\*.exe' 'dist\' -Force
          Get-ChildItem 'dist' | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    # Both platforms must succeed: a release that only carries one of them
    # looks like a broken download to whoever opens the console.
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      # No legacy-named copies any more (ZerkPlay-Public-*). They existed only so
      # clients at 2.10.0 and older - whose checker looked for fixed file names -
      # could see an update at all. Those installs have had several releases to
      # move, and every release since 2.10.1 ships one release and three files.
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Zerk Play ${{ env.APP_VERSION }}
          # The console resolves /releases/latest, so this one must win over
          # any older beta tag sitting in the repository.
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **Zerk Play ${{ env.APP_VERSION }} 正式版**

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-setup.exe` | 安装包，推荐 |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-windows-x64-portable.zip` | 免安装，解压即用 |
            | Android | `ZerkPlay-${{ env.APP_VERSION }}-android.apk` | 通用包（arm64 + 32 位 ARM + x86_64），先试这个 |
            | Android 32 位 | `ZerkPlay-${{ env.APP_VERSION }}-android-arm32.apk` | 只有 32 位 ARM，给通用包装不上的老电视盒子 |

            两个安卓包版本号、签名完全一致，可以互相覆盖安装，更新检查一律推通用包；32 位那个只是给老设备兜底，一般设备不用下。

            这一版自带四个安装包，不再另外提供兼容旧客户端的固定文件名副本（`ZerkPlay-Public-*`）。还在 2.10.0 及更早版本的设备，手动装一次本版即可，之后检查更新恢复正常。

            **搜索变快了，也不再搜单集**
            以前每输入一个字就同时发电影、剧集、单集三个请求，单集那一项在服务器上要跑半分钟，结果全被最慢的那个拖住。现在只发一个电影 + 剧集的请求，结果分批往上贴，上个请求没回来不会再压新的。搜「单集」也不会再出现在提示语里。

            **搜索支持拼音首字母**
            输入 `bbjx` 就能搜到「步步惊心」，`ldjj` 是「猎毒计划」；Emby、Jellyfin、飞牛影视三处一样。输入法带出来的 `‘ ’ ·` 之类字符会先被清掉，不会再让整条查询失效。

            **飞牛影视的搜索现在能用**
            飞牛的搜索接口对中文基本是空结果（还要等 6–8 秒），根本搜不出东西。现在启动后在后台把片库的标题、拼音首字母索引到本地，搜索先在本地匹配，本地确实没有才去问服务器，秒出结果。

            **飞牛影视首页的背景跟着海报变**
            以前飞牛首页底下那层是纯黑；现在和 Emby 一样，取当前轮播海报做模糊拉伸，绿色海报就是深绿背景。

            **海报和背景之间不再有那条白线**
            轮播海报的下沿改成渐隐到透明（不是盖一层黑色渐变），背景模糊层同时铺到海报底下，中间不存在一条硬边。窗口模式下滑动首页时那条 1 像素的亮线已经没有了。

            **海报/封面不会再变成文字卡片**
            图片代理返回的占位 SVG、磁盘写满留下的空文件，以前被当成缓存命中，于是那张封面永远是文字卡片，刷新重启都没用。现在读缓存先验文件头，坏文件当场删掉重下；加载失败按 0.5 / 1 / 2 / 4 秒重试三次。启动时还会顺手清理超量的旧图片缓存。

            **侧边栏左上角的图标默认隐藏**
            鼠标移到侧边栏或用键盘选中侧边栏时才淡入，平时不占视觉。

            **中文搜索时「合集」一行不再乱来**
            以前输入中文，合集行会把所有合集都列出来；现在按拼音首字母和包含关系匹配。

            **全屏是真正的全屏**
            启动全屏不再在左右和底部留缝，退出全屏不会卡住、也不会沉到桌面底下；右上角的最小化 / 还原 / 关闭在窗口和全屏下是同一套按钮。

            **出问题能看到原因**
            界面构建异常会直接画在出错的那一块上并写进日志，日志改成了同步写，不会再出现「进程活着、日志 0 字节」。

            Windows 端依赖 [libmpv](https://github.com/shinchiro/mpv-winbuild-cmake)，已经打包进安装目录，不用另外装。安装包默认装到当前用户目录（不弹 UAC），勾选「创建桌面快捷方式」或从开始菜单启动。

  # Test builds are published as pre-releases so they stay out of
  # /releases/latest: the update checker keeps pointing at the last stable
  # version, and the tag carries the run number so every build gets its own.
  test_release:
    name: Publish test build
    needs: [windows, android]
    if: github.ref == 'refs/heads/test-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ env.APP_VERSION }}-${{ github.run_number }}
          name: 测试版 ${{ env.APP_VERSION }}（构建 ${{ github.run_number }}）
          # Never replaces the stable release clients check for updates.
          make_latest: false
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            dist/ZerkPlay-${{ env.APP_VERSION }}-windows-x64-portable.zip
            dist/ZerkPlay-${{ env.APP_VERSION }}-setup.exe
            dist/ZerkPlay-${{ env.APP_VERSION }}-android.apk
            dist/ZerkPlay-${{ env.APP_VERSION }}-android-arm32.apk
          body: |
            **测试版 ${{ env.APP_VERSION }}**，用来验证下面几项修复，不是正式版。

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-windows-x64-portable.zip` | 免安装，解压即用 |
            | Windows x64 | `ZerkPlay-${{ env.APP_VERSION }}-setup.exe` | 安装包 |
            | Android | `ZerkPlay-${{ env.APP_VERSION }}-android.apk` | 通用包（arm64 + 32 位 ARM + x86_64） |
            | Android 32 位 | `ZerkPlay-${{ env.APP_VERSION }}-android-arm32.apk` | 只有 32 位 ARM，给通用包装不上的老盒子 |

            **这次主要是验证 Android 6.0 能不能跑**
            安装门槛从 Android 7.0 压到了 **6.0（API 23）**，6.0 的盒子现在能装了。但要说明白：Flutter 从 3.35 起官方最低要求就是 24，这一版是绕过引擎的声明硬压下来的，属于官方不支持的范围，所以 6.0 上到底能不能正常用只能实测 —— 装完先看能不能进首页，再试着播一集；如果闪退，把日志（`Android/data/cloud.zerk.play/files/logs/` 或应用内日志页）发我。

            6.0 设备一般用 `-android-arm32.apk`（老盒子基本都是 32 位 ARM），通用包也可以装（两个包都降到 6.0 了）。Android 7.0 及以上的设备不受影响，照常用通用包，功能完全一样。

            **打开某一集时，焦点落在这一集上**
            以前不管点的是第几集，进来以后焦点都在上面的播放按钮，剧集行还是从第 1 集开始显示 —— 打开第 201 集要自己横着翻两百个海报。现在进来就会把剧集行滚到当前这一集，焦点直接落在它的海报上。Emby、Jellyfin、飞牛影视三个服务都是这样。

            **剧集行排序按钮改成图标，选中才展开文字**
            剧集行标题右边那个排序按钮现在平时只显示一个图标（上下箭头向左转了 90°），焦点移上去才展开「正序 / 倒序」文字，标题行不会再被一块常驻的胶囊撑开。按一下整体反转，选择会记住。

            **飞牛影视详情页改成和 Emby 一样的排版**
            以前飞牛的电影、剧集详情是另一套样子：顶部一张 420 高的横图、左边贴一张竖版海报、信息一行行往下排。现在和 Emby / Jellyfin 详情页完全一致 —— 全屏背景图缓慢缩放、标题和评分在一屏 20% 的位置、简介在右侧半栏、下面是同款按钮胶囊、剧集改成一排 16:9 卡片（带集号、播放进度、焦点放大），最后是演职人员圆形头像和底部一行技术信息。季多的剧集会在上面多一排季选择按钮。

            **首页「继续观看」点击先进详情页**
            以前点一下就直接开播，现在和 Emby 一样先进详情页，播放按钮上会写「继续播放 · 剩余 xx」，旁边多一个「从头播放」。想直接播也行：卡片获得焦点时中间会出现播放圆钮，点它就是这个行为。

            **飞牛影视支持从头播放**
            详情页的「从头播放」会忽略服务端记录的进度，从 0 秒开始。

            **飞牛影视的演员头像**
            上一版重写飞牛详情页时，头像请求漏掉了登录凭证，`sys/img` 直接拒绝，所以电影详情页的演员头像变成了首字母方块。凭证补回来了。剧集的演员本来挂在剧名上、单集查不到，现在会顺着单集 → 剧集往下找，剧集详情页也有演职人员行了。

            **排序后焦点回到当前这一集**
            剧集详情页按排序按钮，列表会反转并把当前这一集重新对齐到行首，焦点也回到这一集的海报上，不再停在排序按钮上。Emby、Jellyfin、飞牛影视三个服务都是这样。

            **飞牛影视整剧详情页也有演员了**
            飞牛把演员挂在导入时关联的那一层：电影自带演职人员，整部剧集本身常常是空的，演职人员挂在单集上。所以上一版单集详情页有头像、整剧详情页没有。现在整剧页会顺着「剧集 → 季 → 单集」往下找第一个真正带头像的名单，整剧页也有演职人员行了。

            **启动全屏不再留两条缝**
            以前启动时进的是自己算坐标的全屏，窗口管理器并不知道已经全屏，还按窗口模式给左右下各留了 8 px 的拖拽边，结果高度是满的、宽度两边各有一条缝。现在全屏交给窗口管理器本身，缝隙没有了。

            **Emby / Jellyfin 首页新增「影视库」布局（默认）**
            设置 → 界面 多了一个开关「首页推荐影视主题」，默认关闭。关闭时首页就是 Emby 网页版的样子：第一行继续观看，第二行我的媒体（每个媒体库一块封面，点进去是这个库的网格），后面每个库一行最新内容。想要原来的海报轮播加按口味排的推荐行，把开关打开就行。飞牛影视的首页不走这套，没有这个开关。

            **影视库首页不再黑屏**
            上一版切到影视库首页时，会把服务器上每个媒体库的最新内容一次性全要下来。库多的账号（十几个库）等于同时发十几条请求，最慢的一条要等九秒，服务器顶不住就直接断开连接，整页几乎什么都没有，只剩侧边栏。现在按屏幕看到的顺序排队加载，最多同时三条；某一条被服务器断开也不会拖累别的行。「继续观看」的两个请求也拆成各自独立，一个失败另一个照常显示。真的什么都没拿到时，页面会给一行提示和「重试」按钮，不会再是一片黑。

            **设置里去掉开关下面的说明文字**
            「首页推荐影视主题」下面那段小字删掉了，只留标题。

            **首页黑屏（第二层原因）：页面根本没建出来**
            上一版把黑屏归到并发，其实还漏了一层：首页的行列表是在 `didChangeDependencies` 里构造的，在那里抛异常会被框架吞掉，行列表留在 null，页面就渲染成一个「没有行」的空列表 —— 只有底色，连骨架都不显示。现在建行整体包了兜底：出错会把异常和堆栈写进日志，并退回「继续观看」一行；「每个媒体库」列表加了 15 秒超时，请求卡住也不会让下半页永远缺席；真的什么都没有时给一行提示和「重试」按钮。

            **报错会直接显示在屏幕上**
            release 版里某个界面构建出错，默认只画一块深色矩形，和「页面空白」根本分不出来。现在异常信息会直接画在出问题的那一块上，同时写进日志（`[error] widget:`），下次一眼就能看出是哪一行。

            **日志不会再写不出来**
            日志原来走 `IOSink` + `await flush()`：那个 future 一旦不返回，整份日志就停在 0 字节 —— 这次就是这样，进程一直在跑、日志文件是空的，等于把排查的灯关了。现在改成同步追加写，写失败只报一次，不会再卡住。

            **启动全屏等待加上限**
            进全屏的调用最多等 3 秒，窗口管理器没回应也照常往下走，不会出现「窗口起了但首页永远是黑的」。

            **首页黑屏的真正原因：整个页面被压成了 0 尺寸**
            前两版都在查数据（并发、异常、超时），方向偏了。真正的原因在布局：首页是被挂在一个宽松约束下的（侧边栏用 Offstage 包着页面，给的是 0 到屏幕大小），而首页最外层的 Stack 里有一个「不需要显示遮罩」时返回的 `SizedBox.shrink()` —— 它是一个 0×0 的非定位子节点。Flutter 的 Stack 一旦发现非定位子节点，就按它们的尺寸决定自己的大小，于是整个 Stack 变成 0×0，里面的行列表视口高度也是 0，一行都不会构建：没有请求、没有骨架、没有封面图，屏幕上只剩一层底色和侧边栏。
            这也解释了上一版「先显示一下界面，然后全部黑屏」：加载中遮罩是 `Positioned.fill`，尺寸正常所以能看到页面；加载完成把遮罩换成 `SizedBox.shrink()`，整页立刻塌成 0。
            现在「不显示遮罩」也返回 `Positioned.fill`，两个首页布局的外层 Stack 都改成 `StackFit.expand`，页面自己占满视口，不再由子节点决定大小。本地用 widget 测试复现过：旧写法在宽松约束下量出来是 `Size(0.0, 0.0)`，改完是视口大小。

            **全屏时右上角的三个按钮回来了**
            以前全屏会把最小化 / 还原 / 关闭 整块藏起来。现在全屏也保留那三个按钮，中间的图标变成「退出全屏」，点一下回到窗口模式；拖动条只在窗口模式下存在。

            **「我的媒体」卡片和继续观看一样大**
            上一版「我的媒体」只有一张图，没有图片下面的名称，整块比同一页的继续观看卡片小一圈。现在两张卡片是同一个尺寸：同样的宽度、同样的 16:9、图下同样留 14 px 再放一行名称。

            **媒体库各行统一用竖版封面**
            以前电视剧库那几行是 16:9 横图，和其他库不一致。现在从第三行往下的每个库都用竖版海报，剧集条目会自动取所属剧集的竖版封面，不再显示横版剧照。

            **影视库首页也有海报轮播了**
            默认的影视库布局现在和推荐主题共用同一个舞台：顶部是 16:9 全屏海报，向上滚动时被裁掉，第一行内容压在海报下沿。海报会从已加载的继续观看和媒体库里随机轮播，鼠标移上去或按方向键可以左右切换，点一下打开当前这部。

            **首页等待加载的动画恢复了**
            上一版排查「首页黑屏」时，为了排除「遮罩盖住页面」这条可能，把影视库布局的首屏加载动画整个跳过了，只留灰色的骨架行 —— 那只是当时的猜测，真正原因是页面被压成 0 尺寸。现在两种首页都有那段胶片倒数的加载动画，服务器响应慢的时候（这台机器上首屏要等七秒多）不会再干看着一排灰块。

            **全屏改成真正的全屏，底部那条缝没有了**
            上一版把全屏交给了窗口管理器，但它只在「自己设的全屏」里才去掉窗口那圈 8 px 的拖拽边。这个窗口的标题栏是隐藏的，走的是另一条分支：进全屏时它先把窗口标记成无边框，此后每次都按显示器工作区去算客户区，任务栏那一块就被留在下面 —— 全屏后最下方那条缝就是这么来的。现在全屏由程序自己算：去掉边框后直接铺到显示器的完整矩形，客户区正好等于屏幕，不再经过那圈拖拽边。Windows 上启动全屏、F11、播放器里的全屏都走这条路。

            **退出全屏不再卡住，也不会沉到桌面底下**
            窗口管理器的退出全屏会恢复原来的窗口尺寸，但不激活窗口，还会顺手把 DWM 的边框重算一遍，结果是窗口回到桌面最底层、鼠标点不动，看着像卡死。现在退出全屏走自己的路径：恢复进全屏前保存的窗口位置和窗口样式、重新计算客户区，再把窗口提到最前并交回焦点 —— 点「还原」回到的就是进全屏之前那个窗口。

            **全屏时右上角的按钮和窗口模式一致了**
            上一版全屏时中间那个按钮是「退出全屏」的四角箭头，和窗口模式下的方框图标看起来像两套按钮。现在全屏和最大化共用同一个「还原」图标，点一下都回到窗口；拖动条仍然只在窗口模式下存在。

            **海报、封面加载失败会自己重试了（文字卡片能变回图片）**
            Emby 和飞牛影视的封面加载失败后，本来应该只是这一次失败，但它会把「不是图片的东西」写进本地图片缓存：飞牛的图片代理在还没拿到远端图时会先回一张 SVG 占位图，磁盘写满时留下的是一次 0 字节的文件，反向代理出错时回的是 XML。这些文件被当成缓存命中，每次解码都报 `Invalid image data`，于是那张海报从此永远是文字卡片 —— 重启、刷新都没用。
            现在读缓存先验证文件头：空文件、SVG、XML、JSON 直接删掉并重新下载；写入只接受真正的图片，而且先写临时文件再改名，中途中断只会留下一个临时文件，不会污染原图。加载失败还会按 0.5 / 1 / 2 / 4 秒自动重试三次（重试时会绕过坏缓存），失败后不再继续轰炸服务器。启动时顺手清理一遍历史缓存里的坏文件，并把目录上限压到 320 MB（之前涨到了 557 MB）。

            **背景跟着轮播海报的色系走，不再是死黑**
            以前海报下面直接是固定的纯黑，绿色调的海报压在一片黑上，过渡很硬。现在整页底下多了一层「当前这张海报自己的模糊放大版」：海报是绿色，背景就是深绿；海报是暖黄色，背景就偏暖。这层是模糊 + 压暗过的，只保留色系，不会干扰上面的文字和卡片；换片时用 0.9 秒淡入淡出过渡。

            **海报下沿那条白线没有了**
            窗口模式下，海报和背景交界处有一条约一像素的亮线（全屏时看不出来）。原因是海报底部那层渐变刚好结束在裁切边缘上：那一行像素只被渐变盖住了一部分，露出的海报原图比背景亮，就成了一条线。现在渐变多预留几像素并且最后一段是完全不透明的底色，海报的边缘一定被盖满；底色又和背景层同色，两层之间没有台阶。

            **侧边栏左上角的图标默认隐藏**
            那个角落里的大图标平时不显示了，页面干净一些；鼠标移进侧边栏、或者用键盘把焦点移进侧边栏时，它会淡入并轻微放大出现。服务器切换面板打开时也一定显示（面板是挂在它右边的）。它没有被移出控件树，所以 D-pad 仍然可以从它进入服务器列表。

            **飞牛影视的首页背景也跟着轮播海报走了**
            上一版只给 Emby / Jellyfin 首页加了「模糊海报背景」，飞牛首页还是纯黑：它的海报下沿是一块渐变，渐变写死的终点是纯黑，所以轮播换到哪一张，页面下半部分都还是黑。现在飞牛首页也铺同一层背景（当前海报的模糊放大版），海报下沿改成把画面本身擦成透明——透明的地方露出来的就是背景的色系，两层真正连成一片。换片时海报和背景同时切换。

            **搜索快多了（不再搜索单集）**
            以前一次搜索会同时发三个请求：电影、剧集、**单集**，然后用「全部到齐」的方式等结果——单集搜索要扫全库每一集的标题，是最慢的那个，实测 27~35 秒，所以前面两个早就回来了，页面还是白等。现在：
            1. 不再搜单集，只搜电影和剧集；
            2. 电影和剧集合成**一个**请求（服务端一次返回，客户端自己分两行）；
            3. 结果到了就先显示，合集和外部资料（TMDB）后面到再补一行，不再互相等待；
            4. 同一时间只发一个搜索请求，打字打快时排队的最新关键词会顶掉旧的，不会十几个请求一起压在服务器上。
            搜索耗时现在会写进日志（`[search] "关键词" -> N 条 in X ms`），下一轮可以直接看数字。

            **飞牛影视的搜索能用了（之前根本搜不到东西）**
            查了日志，问题在服务端：同一次会话里，飞牛的关键词搜索要 6～8 秒，然后返回一个空列表；字母（比如 `f`）50 毫秒就能出结果。也就是说中文关键词基本搜不出东西，不是界面没显示，是服务端没返回。
            现在改成**客户端自己建标题索引**：打开搜索页时，后台按 100 条一页、一页之间停 40 毫秒，把每个媒体库（含在线库）的条目逐页列出来，边列边匹配，索引涨了结果就自动补上。中文的部分匹配（`步步` 这种）和拼音首字母（`bbjx`）都在本地算，不再依赖服务端的搜索索引。服务端那一路保留着，本地一条都没有时才去问它。
            日志里会写 `[fnos] title index: N entries in X ms (M requests)`，索引建了多大、花了多久一眼能看到。

            **所有服务都支持拼音首字母搜索**
            输入 `bbjx` 就能搜到「步步惊心」，`qyn` 搜「庆余年」，`fzxx` 搜「凡人修仙传」。首字母表是内置的（两万多个汉字），不联网、不占内存。
            - Emby 自己就支持拼音（实测 `bbjx`、`bubujingxin` 都能出「步步惊心」），这一版只是把输入里的分隔符清掉——中文输入法在候选阶段会往框里塞 `bu'bu'jing'x` 这种带单引号的串，以前原样发给服务端，等于搜了一串没意义的东西。
            - 飞牛没有拼音支持，走上面那套本地索引。
            另外顺手修了一个老问题：中文搜索时「合集」那一行会显示三十个不相干的合集（中文被过滤成空字符串，判断条件就当成了「全部匹配」）。

            **海报和背景之间真正融为一体了**
            上一版是「在海报上盖一层背景色的渐变」，而海报下面那层背景已经带上了海报自己的色偏 —— 一个盖成纯色、一个是带色的，两者只能在某一条线上对上，所以那条缝还在，只是从亮线变成了暗带。
            这一版换成标准的做法：不再盖颜色，而是用 `ShaderMask` + `BlendMode.dstIn` 把海报本身渐渐擦成透明（白→透明的遮罩，带软肩的非线性曲线，不是从头到尾的直线渐变）。海报消失的地方露出的是它自己的模糊放大版，颜色天然是连续的，所以接缝在任何滚动位置、任何一张海报上都不存在。另外加了一个 widget 测试 `test/hero_fade_test.dart`：逐行取像素，断言切口上方那一行已经和背景一致、且整列没有任何相邻两行跳变。

            **海报最下沿再留 24 像素全透明**
            2.10.12 的遮罩是「到边才刚变全透明」，也就是海报的那条裁切边上还挂着一点点原图。在窗口模式下，这一条边正好落在两层画面的接缝上，某些窗口尺寸和滚动位置就会露出一像素亮线（全屏尺寸不同，看不出来）。现在淡化在海报裁切边**上方 24 像素就已经完成**，边外什么都没有，也就不可能再露出线来。测试里也加了这条断言：切口前 18 行必须和背景完全一致（差 < 1）。

            **背景那层改成小图放大，海报的遮罩层边移出画面**
            背景（当前海报的模糊放大版）原来是「整页大小的一层直接做高斯模糊」：这么大的模糊面会被合成器切成多块，块与块的接缝那一行像素会取错位置，表现就是一条一像素的亮线，而且只在滚动到特定位置时才落在视野里。现在背景用 180 px 的小图先模糊、再放大铺满（视觉上一样，开销小得多，电视盒子上也更快）。
            海报身上那层渐隐是个 saveLayer，它的下边缘如果正好落在裁切线上，也会被合成器单独混一行 —— 现在它的下边缘挂在裁切线下 2 像素，画面里只剩一条不带图层的硬裁切。

